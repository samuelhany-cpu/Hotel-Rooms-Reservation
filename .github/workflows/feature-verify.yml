name: Verify portfolio demo branch

on:
  push:
    branches:
      - feature/portfolio-demo-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate lockfile for Milestone 4 dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply formatting
        run: npm run format

      - name: Commit generated lockfile and formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/portfolio-demo-v1'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Update Milestone 4 lockfile and formatting"
            git push origin HEAD:refs/heads/feature/portfolio-demo-v1
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run focused tests
        run: npm run test

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build production application
        run: npm run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run real-browser tests
        run: npm run test:e2e

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
